# CI for Airbotix / DeepRouter internal packages.
# Runs only on changes to our additions (model/user.go, internal/**) to avoid
# stepping on upstream NewAPI's own CI matrix.
name: airbotix-internal

on:
  push:
    branches: [main]
    paths:
      - 'model/user.go'
      - 'model/user_airbotix_test.go'
      - 'internal/**'
      - 'middleware/policy.go'
      - 'middleware/policy_test.go'
      - 'relay/airbotix_policy.go'
      - 'relay/airbotix_policy_test.go'
      - 'relay/kids_coverage_matrix_test.go'
      - 'service/airbotix_billing.go'
      - 'service/org_wallet.go'
      - 'service/org_wallet_test.go'
      - 'service/org_alerts.go'
      - 'service/org_alerts_test.go'
      - 'service/billing.go'
      - 'service/billing_session.go'
      - 'service/quota.go'
      - 'service/task_billing.go'
      - 'service/text_quota.go'
      - 'middleware/auth.go'
      - 'middleware/org_wallet.go'
      - 'model/log.go'
      - 'model/org_log.go'
      - 'model/task.go'
      - 'relay/common/relay_info.go'
      - 'relay/common/org_spend.go'
      - 'constant/context_key.go'
      - 'setting/ratio_setting/**'
      - 'setting/alias_setting/**'
      # setting/alias_setting's tests hold its rule lists against this file.
      - 'scripts/seed-models/channels.yaml'
      - 'relay/channel/task/doubao/**'
      - 'relay/channel/task/hailuo/**'
      - 'service/convert.go'
      - 'relay/channel/claude/**'
      - 'relay/channel/openai/**'
      - 'relay/channel/elevenlabs/**'
      - 'controller/**'
      - 'router/**'
      - 'dto/**'
      - 'common/**'
      - 'docs/kids-coverage-matrix.md'
      - 'scripts/check-kids-coverage-matrix.sh'
      - '.github/workflows/airbotix-internal.yml'
  pull_request:
    paths:
      - 'model/user.go'
      - 'model/user_airbotix_test.go'
      - 'internal/**'
      - 'middleware/policy.go'
      - 'middleware/policy_test.go'
      - 'relay/airbotix_policy.go'
      - 'relay/airbotix_policy_test.go'
      - 'relay/kids_coverage_matrix_test.go'
      - 'service/airbotix_billing.go'
      - 'service/org_wallet.go'
      - 'service/org_wallet_test.go'
      - 'service/org_alerts.go'
      - 'service/org_alerts_test.go'
      - 'service/billing.go'
      - 'service/billing_session.go'
      - 'service/quota.go'
      - 'service/task_billing.go'
      - 'service/text_quota.go'
      - 'middleware/auth.go'
      - 'middleware/org_wallet.go'
      - 'model/log.go'
      - 'model/org_log.go'
      - 'model/task.go'
      - 'relay/common/relay_info.go'
      - 'relay/common/org_spend.go'
      - 'constant/context_key.go'
      - 'setting/ratio_setting/**'
      - 'setting/alias_setting/**'
      # setting/alias_setting's tests hold its rule lists against this file.
      - 'scripts/seed-models/channels.yaml'
      - 'relay/channel/task/doubao/**'
      - 'relay/channel/task/hailuo/**'
      - 'service/convert.go'
      - 'relay/channel/claude/**'
      - 'relay/channel/openai/**'
      - 'relay/channel/elevenlabs/**'
      - 'controller/**'
      - 'router/**'
      - 'dto/**'
      - 'common/**'
      - 'docs/kids-coverage-matrix.md'
      - 'scripts/check-kids-coverage-matrix.sh'
      - '.github/workflows/airbotix-internal.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Resolve module deps
        run: go mod download

      - name: Vet Airbotix-owned packages
        # Limited to packages with our additions. Vetting the wider relay tree
        # pulls in upstream relay/channel/* dependencies that have pre-existing
        # "unreachable code" diagnostics — we let build/test gate those.
        run: go vet ./internal/... ./middleware/...

      - name: Build full tree we wire into
        # NOTE: controller/ and router/ are included so a Go compile error
        # like PR #8's `cleanUser.Setting = &settingStr` (string vs *string
        # mismatch) gets caught here. The full-tree docker build only
        # runs on push to alpha/nightly branches, so without these two
        # paths a broken main can sit broken for days.
        run: |
          go build ./internal/...
          go build ./model/... ./constant/... ./middleware/... ./service/... ./relay/...
          go build ./controller/... ./router/... ./dto/... ./common/...

      - name: Run unit tests
        run: |
          # 🔴 600s, not 120s: internal/connect runs the real setup and
          # uninstall scripts in a throwaway HOME against a fake gateway,
          # and every case pays for spawning a shell plus a handful of curl
          # processes. That is the point of those tests - the card they come
          # from is a script that edits the user's machine, and asserting on
          # the template text would prove nothing about what it does.
          go test ./internal/... -count=1 -race -timeout 600s
          go test ./model/ -run 'TestUser_Airbotix' -count=1 -timeout 60s
          # kids_mode relay layer: all constraints incl. max_tokens cap and model
          # whitelist gate (DR-12). TestKidsModeCoverageMatrix enforces that every
          # function listed in docs/kids-coverage-matrix.md actually exists.
          go test ./relay/ -run 'TestApplyAirbotixPolicy|TestClampUint|TestCheckAirbotixModelWhitelist|TestKidsModeCoverageMatrix' -count=1 -race -timeout 60s
          # Smart-router integration: catalog endpoint pricing math, kids
          # pre-filter, brand map, input validation, cross-model fallback,
          # internal-token auth, ResolveAutoModel hot path.
          # 180s, not 60s: the TestOrg sign-up tests hash real passwords, and
          # each bcrypt hash costs about 0.6s under the race detector. The
          # line took 18s on a developer machine when this was raised.
          go test ./controller/ -run 'TestMiniMaxVideo|TestMediaKey|TestSeedance|TestSeedream|TestChannelTestModality|TestChannelTestImageModels|TestModelRatio|TestGetModelRatio|TestKidsMode|TestListModels|TestGetRouterCatalog|TestChannelTypeToBrand|TryCrossModelFallback|IsChannelExhaustion|TestAdmin|TestSkillIDParam|TestVersionIDParam|TestDownloadMarketplaceSkill|TestAddTokenReturnsCreatedKey|TestKeyPurpose|TestUpdateSelf|TestOrg' -count=1 -race -timeout 180s
          # kids_mode middleware layer: policy resolution + defensive pass-through (DR-12).
          go test ./middleware/ -run 'TestAirbotixPolicy|TestInternalToken|TestResolveAutoModel' -count=1 -race -timeout 60s
          # Pricing consistency: default ratio/price coverage for cache-ratio models
          # and the Doubao/Seedance + MiniMax/Hailuo video ModelLists (价格未配置
          # regression guards; hailuo also covers the v2/H3 request conversion).
          # Gemini protocol conversion: top_k must not reach OpenAI, and the
          # Gemini->Claude bridge must keep producing Claude/Gemini shapes.
          # TestOrg: Enterprise Org's company wallet on the billing path - whose
          # balance pays, the usage-log stamp, task refunds, the low-balance
          # reminder (service/org_wallet_test.go).
          go test ./service/ -run 'TestGeminiToOpenAIRequest|TestOrg' -count=1 -timeout 60s
          go test ./relay/channel/openai/ -run 'TestConvertOpenAIRequest' -count=1 -timeout 60s
          go test ./relay/channel/claude/ -run 'TestConvertGeminiRequest|TestHandleClaudeResponseData|TestHandleStreamResponseData' -count=1 -timeout 60s
          go test ./setting/ratio_setting/ -count=1 -timeout 60s
          go test ./relay/channel/task/doubao/ -count=1 -timeout 60s
          go test ./relay/channel/task/hailuo/ -count=1 -timeout 60s
          # Simple-mode purpose registry: the video whitelist/alias must keep
          # pointing at sellable models (Video First Wave AC-E — the veo/sora
          # placeholder bug made every Simple video key unusable).
          go test ./setting/alias_setting/ -count=1 -timeout 60s
          go test ./relay/channel/elevenlabs/ -count=1 -race -timeout 60s
          go test ./controller/ -run 'TestElevenLabs|TestBuildTestRequestForElevenLabs' -count=1 -race -timeout 60s
          # Route registration smoke: gin validates its tree at registration
          # time, so a wildcard-name conflict (e.g. /api/skills/:slug vs :id)
          # panics on startup and only this test catches it before deploy.
          go test ./router/ -run 'TestSetApiRouter|TestSetConnectRouter|TestOrg' -count=1 -timeout 60s

      - name: Verify kids coverage matrix (go test -list)
        # scripts/check-kids-coverage-matrix.sh parses docs/kids-coverage-matrix.md,
        # runs go test -list for each referenced package, and fails if any explicitly
        # named function is absent. This catches deletions that broad -run regexes miss.
        run: bash scripts/check-kids-coverage-matrix.sh

      - name: Skill Marketplace runner unit tests (Python stdlib)
        # deeprouter_skill_runner.py is a zero-dependency script bundled into
        # every skill package (see internal/skill-marketplace/packageassets);
        # these test its pure functions (request building, response parsing)
        # with the stdlib unittest module — no pip install needed.
        run: python3 -m unittest discover -s internal/skill-marketplace/packageassets -p '*_test.py' -v
