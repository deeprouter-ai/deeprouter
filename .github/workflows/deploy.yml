# Production deploy: push to main → build image → ECR push → SSM rolls the
# single-EC2 docker-compose stack (deeprouter-ai/infra-ec2).
#
# Auth: GitHub OIDC → assume role/deeprouter-github-deploy (provisioned by
# deeprouter-ai/infra terraform, infra-ec2/cicd.tf). Trust policy is pinned to
# repo:deeprouter-ai/deeprouter:ref:refs/heads/main. No long-lived AWS keys,
# no inbound SSH — the deploy runs on the box via SSM RunShellScript.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - 'middleware/**'
      - 'model/**'
      - 'relay/**'
      - 'router/**'
      - 'service/**'
      - 'internal/**'
      - 'common/**'
      - 'dto/**'
      - 'constant/**'
      - 'setting/**'
      - 'web/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::180294203030:role/deeprouter-github-deploy
  ECR_REPOSITORY: deeprouter
  INSTANCE_TAG: deeprouter

jobs:
  # Signed macOS installer for the /d/:token download (PRD §11.7, card P8).
  # Builds ONLY when the signing secrets exist, and uploads ONLY the signed
  # artifact — an unsigned pkg must never reach production, Gatekeeper would
  # block it on double-click, which is worse than the endpoint answering 404
  # (the key page falls back to the .sh with a toast while dark).
  # PR-side twin of these build steps: macos-pkg.yml.
  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether signing is configured
        id: creds
        env:
          CERT: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing credentials - production ships without the macOS pkg (endpoint stays dark)."
          fi

      - name: Import the signing certificate
        if: steps.creds.outputs.signing == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"

      - name: Build, sign, notarize
        if: steps.creds.outputs.signing == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          DR_NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          DR_NOTARY_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          DR_PKG_VERSION: "1.0.${{ github.run_number }}"
        run: |
          set -eu
          echo "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/asc-key.p8"
          export DR_NOTARY_KEY_FILE="$RUNNER_TEMP/asc-key.p8"
          DR_SIGN_IDENTITY=$(security find-identity -v | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)
          [ -n "$DR_SIGN_IDENTITY" ] || { echo "::error::cert imported but no Developer ID Installer identity found"; exit 1; }
          export DR_SIGN_IDENTITY
          sh internal/connect/macos-pkg/build.sh dist
          # PRD §11.4: no plaintext key may ever land in a downloadable file.
          ! grep -R "sk-" internal/connect/macos-pkg/dist --include="*.pkg" 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.signing == 'true'
        with:
          name: signed-macos-pkg
          path: internal/connect/macos-pkg/dist/deeprouter-setup.pkg
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    # A pkg failure must not block production deploys — the endpoint just
    # stays dark and the page falls back to the .sh.
    needs: [pkg]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Stage the signed macOS installer into the build context
        # No artifact (secrets unfilled, or the pkg job failed) → this step
        # fails, the dir keeps only .gitkeep, and the image ships dark.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: signed-macos-pkg
          path: internal/connect/macos-pkg/dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Roll the stack via SSM
        # Roll ONLY the new-api service to the image this workflow just pushed.
        # The previous box-side ci-deploy.sh ran `docker compose pull` for the
        # WHOLE stack and bailed (skip-roll, exit 0) whenever any other image
        # (e.g. smart-router, owned by a different repo/CI) wasn't pullable from
        # ECR — so a green deploy could leave the box on the old image. This
        # repo only ships new-api, so pull+recreate just that service, pinned to
        # the :latest tag pushed above, regardless of the box .env's pin.
        run: |
          set -euo pipefail
          # The box .env is missing SMART_ROUTER_IMAGE, and the compose file
          # declares smart-router.image: ${SMART_ROUTER_IMAGE:?...}, so ANY
          # `docker compose` call fails at interpolation before doing anything.
          # We only roll new-api, so supply BOTH image vars inline (a valid
          # smart-router ref is enough — it is never pulled/recreated here) and
          # pass --no-deps so only new-api is touched.
          ROLL='set -e; cd /opt/deeprouter; REG=180294203030.dkr.ecr.ap-southeast-2.amazonaws.com; aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin $REG; export DEEPROUTER_IMAGE=$REG/deeprouter:latest; export SMART_ROUTER_IMAGE=$REG/smart-router:latest; docker compose -f docker-compose.prod.yml pull new-api; docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate new-api; docker image prune -af || true'
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=$INSTANCE_TAG" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy deeprouter ${GITHUB_SHA::7}" \
            --parameters "commands=[$(printf '%s' "$ROLL" | jq -Rs .)]" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          STATUS=Pending; INSTID=
          for i in $(seq 1 90); do
            sleep 10
            read STATUS INSTID < <(aws ssm list-command-invocations \
              --command-id "$CMD_ID" --query "CommandInvocations[0].[Status,InstanceId]" \
              --output text 2>/dev/null || echo "Pending -")
            echo "  [$i] status=$STATUS instance=$INSTID"
            case "$STATUS" in
              Success) break;;
              Failed|Cancelled|TimedOut)
                echo "::error::deploy failed on $INSTID"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTID" \
                  --query StandardErrorContent --output text || true
                exit 1;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "::error::timed out"; exit 1; }
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTID" \
            --query StandardOutputContent --output text
