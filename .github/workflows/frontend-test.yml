# Frontend Tests — runs the web/default Vitest suite + typecheck on PRs that
# touch the frontend. Path-filtered so backend-only PRs are unaffected.
#
# NOT a required status check yet (Track B plan B8): let it run green and prove
# stable on PRs first, then a repo admin can mark it required in branch
# protection. Kept lean (typecheck + vitest) to stay fast and deterministic,
# matching the philosophy of unit-test.yml.
name: Frontend Tests

on:
  pull_request:
    paths:
      - 'web/default/**'
  push:
    branches: [main]
    paths:
      - 'web/default/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-test:
    name: typecheck + vitest (web/default)
    runs-on: ${{ fromJSON(vars.SERVICE_CI_RUNNER_LABELS) }}
    defaults:
      run:
        working-directory: web/default
    steps:
      - name: Require independent Mac CI
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          case "${RUNNER_NAME:-}" in lightman-mac-studio-*) ;; *) echo 'Service builds require the existing independent Mac CI' >&2; exit 1 ;; esac
          case "$(uname -s)" in
            Darwin) test "$(sysctl -n hw.model)" = Mac13,1 ;;
            Linux) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          case "${BUILDKIT_HOST:-}" in ''|unix://*) ;; *) echo 'Remote BuildKit is forbidden' >&2; exit 1 ;; esac
          if command -v docker >/dev/null 2>&1; then
            endpoint="${DOCKER_HOST:-}"
            if [ -n "${DOCKER_CONTEXT:-}" ] || [ -z "$endpoint" ]; then
              endpoint=$(docker context inspect ${DOCKER_CONTEXT:+"$DOCKER_CONTEXT"} --format '{{.Endpoints.docker.Host}}')
            fi
            case "$endpoint" in unix://*|tcp://docker:2376) ;; *) echo 'Production/remote Docker is forbidden' >&2; exit 1 ;; esac
          fi
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test
