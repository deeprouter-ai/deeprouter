# Unit Tests — required gate on every PR.
#
# Unlike airbotix-internal.yml (push/path-filtered), this workflow runs on EVERY
# pull request with no path filter, so it can be marked a **required status
# check** in branch protection. AGENTS.md Rule 12 ("Unit Tests Required") is the human-facing half
# of this gate; this workflow is the machine-enforced half.
#
# Scope rationale (same as airbotix-internal.yml): we run the Airbotix-owned unit
# layer plus the focused upstream-adjacent tests we wire into — NOT a blanket
# `go test ./...`. The wider relay/channel/* tree pulls in upstream NewAPI tests
# that need external services (MySQL/Redis) or carry pre-existing diagnostics; the
# docker/release builds gate those. Keeping this gate fast and deterministic is
# what lets it stay *required*.
name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: go vet + gofmt + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve module deps
        run: go mod download

      - name: gofmt (Airbotix-owned packages)
        run: |
          unformatted=$(gofmt -l ./internal/ ./middleware/ ./relay/airbotix_policy.go ./service/airbotix_billing.go)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (Airbotix-owned packages)
        # Limited to packages with our additions; the wider relay tree carries
        # upstream "unreachable code" diagnostics that build/test gate instead.
        run: go vet ./internal/... ./middleware/...

      - name: Build the tree we wire into
        run: |
          go build ./internal/...
          go build ./model/... ./constant/... ./middleware/... ./service/... ./relay/...
          go build ./controller/... ./router/... ./dto/... ./common/...

      - name: Run unit tests
        run: |
          # Airbotix-internal packages — full suite, race-enabled.
          # 🔴 600s, not 120s: internal/connect runs the real setup and
          # uninstall scripts in a throwaway HOME against a fake gateway,
          # and every case pays for spawning a shell plus a handful of curl
          # processes. That is the point of those tests - the card they come
          # from is a script that edits the user's machine, and asserting on
          # the template text would prove nothing about what it does.
          go test ./internal/... -count=1 -race -timeout 600s
          # Upstream-adjacent fork tests (kept in sync with airbotix-internal.yml).
          go test ./model/ -run 'TestUser_Airbotix' -count=1 -timeout 60s
          go test ./relay/ -run 'TestApplyAirbotixPolicy|TestClampUint|TestCheckAirbotixModelWhitelist|TestKidsModeCoverageMatrix' -count=1 -race -timeout 60s
          go test ./controller/ -run 'TestMiniMaxVideo|TestMediaKey|TestSeedance|TestSeedream|TestChannelTestModality|TestChannelTestImageModels|TestModelRatio|TestGetModelRatio|TestKidsMode|TestListModels|TestGetRouterCatalog|TestChannelTypeToBrand|TryCrossModelFallback|IsChannelExhaustion|TestAdmin|TestSkillIDParam|TestVersionIDParam|TestDownloadMarketplaceSkill|TestAddTokenReturnsCreatedKey' -count=1 -race -timeout 60s
          go test ./middleware/ -run 'TestAirbotixPolicy|TestInternalToken|TestResolveAutoModel' -count=1 -race -timeout 60s
          # Pricing consistency: default ratio/price coverage for cache-ratio models
          # and the Doubao/Seedance + MiniMax/Hailuo video ModelLists (价格未配置
          # regression guards; hailuo also covers the v2/H3 request conversion).
          # Gemini protocol conversion: top_k must not reach OpenAI, and the
          # Gemini->Claude bridge must keep producing Claude/Gemini shapes.
          go test ./service/ -run 'TestGeminiToOpenAIRequest' -count=1 -timeout 60s
          go test ./relay/channel/openai/ -run 'TestConvertOpenAIRequest' -count=1 -timeout 60s
          go test ./relay/channel/claude/ -run 'TestConvertGeminiRequest|TestHandleClaudeResponseData|TestHandleStreamResponseData' -count=1 -timeout 60s
          go test ./setting/ratio_setting/ -count=1 -timeout 60s
          go test ./relay/channel/task/doubao/ -count=1 -timeout 60s
          go test ./relay/channel/task/hailuo/ -count=1 -timeout 60s
          # Simple-mode purpose registry: the video whitelist/alias must keep
          # pointing at sellable models (Video First Wave AC-E — the veo/sora
          # placeholder bug made every Simple video key unusable).
          go test ./setting/alias_setting/ -count=1 -timeout 60s
          go test ./relay/channel/elevenlabs/ -count=1 -race -timeout 60s
          go test ./controller/ -run 'TestElevenLabs|TestBuildTestRequestForElevenLabs' -count=1 -race -timeout 60s
          # Route registration smoke: gin validates its tree at registration
          # time, so a wildcard-name conflict (e.g. /api/skills/:slug vs :id)
          # panics on startup and only this test catches it before deploy.
          go test ./router/ -run 'TestSetApiRouter|TestSetConnectRouter' -count=1 -timeout 60s

      - name: Verify kids coverage matrix
        run: bash scripts/check-kids-coverage-matrix.sh
